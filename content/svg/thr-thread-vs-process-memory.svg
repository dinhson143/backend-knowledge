<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Hai process có bộ nhớ riêng và nói chuyện qua IPC; một process nhiều thread dùng chung code, global, heap, fd, mỗi thread có stack và thanh ghi riêng</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .proc { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .cell { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .sh { fill: #e4f5ef; stroke: #14a37f; stroke-width: 1.4; }
      .own { fill: #e8f0fe; stroke: #3b7ff5; stroke-width: 1.2; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .b { font-size: 13px; font-weight: 650; fill: #1f2937; text-anchor: middle; }
      .c { font-size: 12.5px; fill: #1f2937; text-anchor: middle; }
      .sc { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .gk { font-size: 12.5px; font-weight: 650; fill: #0f7a5f; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="408" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- Hai process -->
  <rect class="grp" x="20" y="16" width="282" height="300" rx="12"/>
  <text class="h" x="34" y="40">Hai process</text>
  <text class="s" x="34" y="58">mỗi process một page table riêng</text>

  <rect class="proc" x="32" y="70" width="120" height="186" rx="9"/>
  <text class="b" x="92" y="90">PID 101</text>
  <rect class="cell" x="42" y="100" width="100" height="24" rx="4"/><text class="c" x="92" y="117">code</text>
  <rect class="cell" x="42" y="128" width="100" height="24" rx="4"/><text class="c" x="92" y="145">global + heap</text>
  <rect class="cell" x="42" y="156" width="100" height="24" rx="4"/><text class="c" x="92" y="173">bảng fd</text>
  <rect class="cell" x="42" y="184" width="100" height="24" rx="4"/><text class="c" x="92" y="201">stack</text>
  <rect class="cell" x="42" y="212" width="100" height="24" rx="4"/><text class="c" x="92" y="229">thanh ghi, PC</text>

  <rect class="proc" x="170" y="70" width="120" height="186" rx="9"/>
  <text class="b" x="230" y="90">PID 102</text>
  <rect class="cell" x="180" y="100" width="100" height="24" rx="4"/><text class="c" x="230" y="117">code</text>
  <rect class="cell" x="180" y="128" width="100" height="24" rx="4"/><text class="c" x="230" y="145">global + heap</text>
  <rect class="cell" x="180" y="156" width="100" height="24" rx="4"/><text class="c" x="230" y="173">bảng fd</text>
  <rect class="cell" x="180" y="184" width="100" height="24" rx="4"/><text class="c" x="230" y="201">stack</text>
  <rect class="cell" x="180" y="212" width="100" height="24" rx="4"/><text class="c" x="230" y="229">thanh ghi, PC</text>

  <path d="M92,258 L92,272 L230,272 L230,258" stroke="#64748b" stroke-width="1.4" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="sc" x="161" y="290">IPC qua kernel: pipe, socket,</text>
  <text class="sc" x="161" y="305">shared memory (phải copy, syscall)</text>

  <!-- Một process nhiều thread -->
  <rect class="grp" x="316" y="16" width="424" height="300" rx="12"/>
  <text class="h" x="330" y="40">Một process, ba thread</text>
  <text class="s" x="330" y="58">chung một page table</text>

  <rect class="proc" x="328" y="70" width="400" height="236" rx="9"/>
  <text class="b" x="528" y="90">PID 200</text>
  <rect class="sh" x="340" y="100" width="376" height="72" rx="6"/>
  <text class="gk" x="352" y="120">Dùng chung (thuộc về process)</text>
  <text class="t" x="352" y="141">code · global (data) · heap</text>
  <text class="t" x="352" y="161">fd đang mở · PID · handler signal · thư mục hiện tại</text>

  <rect class="own" x="340" y="184" width="118" height="112" rx="6"/>
  <text class="b" x="399" y="203">Thread 1</text>
  <rect class="cell" x="350" y="208" width="98" height="24" rx="4"/><text class="c" x="399" y="225">stack</text>
  <rect class="cell" x="350" y="236" width="98" height="24" rx="4"/><text class="c" x="399" y="253">thanh ghi, PC</text>
  <text class="sc" x="399" y="276">thread ID, errno,</text>
  <text class="sc" x="399" y="291">signal mask</text>

  <rect class="own" x="469" y="184" width="118" height="112" rx="6"/>
  <text class="b" x="528" y="203">Thread 2</text>
  <rect class="cell" x="479" y="208" width="98" height="24" rx="4"/><text class="c" x="528" y="225">stack</text>
  <rect class="cell" x="479" y="236" width="98" height="24" rx="4"/><text class="c" x="528" y="253">thanh ghi, PC</text>
  <text class="sc" x="528" y="276">thread ID, errno,</text>
  <text class="sc" x="528" y="291">signal mask</text>

  <rect class="own" x="598" y="184" width="118" height="112" rx="6"/>
  <text class="b" x="657" y="203">Thread 3</text>
  <rect class="cell" x="608" y="208" width="98" height="24" rx="4"/><text class="c" x="657" y="225">stack</text>
  <rect class="cell" x="608" y="236" width="98" height="24" rx="4"/><text class="c" x="657" y="253">thanh ghi, PC</text>
  <text class="sc" x="657" y="276">thread ID, errno,</text>
  <text class="sc" x="657" y="291">signal mask</text>

  <text class="t" x="20" y="344">Process: muốn đọc dữ liệu của nhau phải qua IPC; một process crash, process kia vẫn chạy.</text>
  <text class="t" x="20" y="366">Thread: ghi vào heap là thread khác thấy ngay, không copy, nên phải có lock; một thread segfault là cả process chết.</text>
  <text class="s" x="20" y="392">Phần chung/riêng theo pthreads(7); thanh ghi và PC riêng cho mỗi thread theo OSTEP (Threads). Xanh dương: riêng từng thread.</text>
</svg>
