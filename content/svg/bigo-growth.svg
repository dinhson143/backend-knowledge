<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Số phép tính tăng theo n của O(1), O(log n), O(n), O(n log n), O(n²), và con số cụ thể khi n = 10⁵</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <style>
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .ax { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .cv { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .tk { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .tky { font-size: 11.5px; fill: #64748b; text-anchor: end; }
      .lb { font-size: 13px; font-weight: 650; }
      .ok { font-size: 13px; fill: #0f7a5f; }
      .no { font-size: 13px; fill: #c2410c; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="378" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- Trục và lưới: x = 60 + 20n, y = 320 − 7·(số phép tính) -->
  <g class="grid">
    <path d="M60,250 L460,250"/><path d="M60,180 L460,180"/><path d="M60,110 L460,110"/><path d="M60,40 L460,40"/>
  </g>
  <path class="ax" d="M60,32 L60,320 L466,320"/>
  <text class="tky" x="54" y="254">10</text><text class="tky" x="54" y="184">20</text><text class="tky" x="54" y="114">30</text><text class="tky" x="54" y="44">40</text>
  <text class="tk" x="160" y="336">5</text><text class="tk" x="260" y="336">10</text><text class="tk" x="360" y="336">15</text><text class="tk" x="460" y="336">20</text>
  <text class="s" x="66" y="26">số phép tính</text>
  <text class="s" x="466" y="356" text-anchor="end">n (kích thước input) →</text>

  <!-- Đường cong -->
  <path class="cv" stroke="#e0562b" d="M80,313 L90,304 L100,292 L110,276 L120,257 L130,234 L140,208 L150,178 L160,145 L170,108 L180,68 L186,40"/>
  <path class="cv" stroke="#e08a00" d="M80,320 L90,314 L100,306 L110,297 L120,287 L130,276 L140,264 L150,252 L160,239 L170,225 L180,211 L190,197 L200,182 L210,167 L220,152 L230,136 L240,120 L250,104 L260,87 L270,71 L280,54 L288,40"/>
  <path class="cv" stroke="#3b7ff5" d="M80,313 L460,180"/>
  <path class="cv" stroke="#14a37f" d="M80,320 L90,316 L100,313 L120,309 L140,306 L180,302 L220,299 L280,296 L340,293 L400,291 L460,290"/>
  <path class="cv" stroke="#64748b" d="M80,313 L460,313"/>
  <text class="lb" x="192" y="50" fill="#c2410c">O(n²)</text>
  <text class="lb" x="294" y="50" fill="#b45309">O(n log n)</text>
  <text class="lb" x="468" y="184" fill="#1d4ed8">O(n)</text>
  <text class="lb" x="468" y="294" fill="#0f7a5f">O(log n)</text>
  <text class="lb" x="468" y="317" fill="#475569">O(1)</text>

  <!-- n = 10^5 -->
  <rect class="grp" x="548" y="20" width="192" height="300" rx="12"/>
  <text class="h" x="562" y="44">Khi n = 10⁵</text>
  <text class="s" x="562" y="62">máy chạy ~10⁸ phép tính/giây</text>
  <text class="t" x="562" y="96" style="fill:#475569">O(1)</text><text class="ok" x="726" y="96" text-anchor="end">1 ✓</text>
  <text class="t" x="562" y="128" style="fill:#0f7a5f">O(log n)</text><text class="ok" x="726" y="128" text-anchor="end">≈ 17 ✓</text>
  <text class="t" x="562" y="160" style="fill:#1d4ed8">O(n)</text><text class="ok" x="726" y="160" text-anchor="end">10⁵ ✓</text>
  <text class="t" x="562" y="192" style="fill:#b45309">O(n log n)</text><text class="ok" x="726" y="192" text-anchor="end">≈ 1,7×10⁶ ✓</text>
  <text class="t" x="562" y="224" style="fill:#c2410c">O(n²)</text><text class="no" x="726" y="224" text-anchor="end">10¹⁰ ✗</text>
  <text class="s" x="562" y="256">n² chậm hơn ngân sách</text>
  <text class="s" x="562" y="272">1 giây khoảng 100 lần</text>
  <text class="s" x="562" y="300">→ n ≤ 10⁵: cần O(n log n)</text>

  <text class="s" x="20" y="372">Big-O bỏ hằng số: hình cho thấy hình dạng tăng trưởng, không phải thời gian chạy thật.</text>
</svg>
