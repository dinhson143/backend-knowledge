<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Address translation: tra TLB trước, miss thì đi page table nhiều cấp PGD, P4D, PUD, PMD, PTE tới khung vật lý; mục không hợp lệ gây page fault để kernel xử lý</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14a37f"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a00"/></marker>
    <style>
      .f { stroke: #94a3b8; stroke-width: 1.2; }
      .tb { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .ent { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .tlb { fill: #e8f0fe; stroke: #3b7ff5; stroke-width: 1.6; }
      .frm { fill: #e4f5ef; stroke: #14a37f; stroke-width: 1.6; }
      .flt { fill: #fff3db; stroke: #e08a00; stroke-width: 1.6; }
      .out { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .n { font-size: 13px; font-weight: 650; fill: #1f2937; text-anchor: middle; }
      .c { font-size: 12.5px; fill: #1f2937; text-anchor: middle; }
      .sc { font-size: 11.5px; fill: #475569; text-anchor: middle; }
      .lb { font-size: 12px; fill: #475569; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #1f2937; text-anchor: middle; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="488" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <text class="h" x="20" y="30">Address translation: TLB trước, page walk khi miss</text>

  <!-- Địa chỉ ảo: mỗi phần chỉ số cùng màu với bảng nó chọn -->
  <rect class="f" x="20" y="44" width="100" height="32" style="fill:#dbeafe"/><text class="code" x="70" y="65">chỉ số PGD</text>
  <rect class="f" x="120" y="44" width="100" height="32" style="fill:#ede9fe"/><text class="code" x="170" y="65">chỉ số P4D</text>
  <rect class="f" x="220" y="44" width="100" height="32" style="fill:#fce7f3"/><text class="code" x="270" y="65">chỉ số PUD</text>
  <rect class="f" x="320" y="44" width="100" height="32" style="fill:#fef3c7"/><text class="code" x="370" y="65">chỉ số PMD</text>
  <rect class="f" x="420" y="44" width="100" height="32" style="fill:#dcfce7"/><text class="code" x="470" y="65">chỉ số PTE</text>
  <rect class="f" x="520" y="44" width="220" height="32" style="fill:#f1f5f9"/><text class="c" x="630" y="65">offset: 12 bit (trang 4 KB)</text>
  <text class="s" x="20" y="94">x86-64: 48 bit với 4 cấp (P4D bị gộp), 57 bit với 5 cấp. Mỗi phần chỉ số chọn một mục trong bảng cùng màu.</text>

  <!-- TLB và đường hit -->
  <rect class="tlb" x="20" y="112" width="150" height="48" rx="8"/>
  <text class="n" x="95" y="132">TLB</text>
  <text class="sc" x="95" y="150">cache bản dịch trong CPU</text>
  <path d="M170,136 L598,136" stroke="#14a37f" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <text class="lb" x="384" y="128" text-anchor="middle">hit: có sẵn bản dịch, bỏ qua page walk</text>

  <rect class="frm" x="600" y="108" width="140" height="62" rx="8"/>
  <text class="n" x="670" y="128">Khung vật lý</text>
  <text class="sc" x="670" y="145">số khung + offset</text>
  <text class="sc" x="670" y="161">= địa chỉ vật lý</text>

  <!-- Page walk -->
  <path d="M95,160 L95,204" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text class="lb" x="103" y="188">miss</text>

  <rect class="tb" x="20" y="206" width="90" height="96" rx="6" style="fill:#dbeafe"/>
  <text class="code" x="65" y="222">PGD</text>
  <rect class="ent" x="28" y="230" width="74" height="16"/><rect class="ent" x="28" y="248" width="74" height="16" style="fill:#3b7ff5"/><rect class="ent" x="28" y="266" width="74" height="16"/><rect class="ent" x="28" y="284" width="74" height="12"/>

  <rect class="tb" x="125" y="206" width="90" height="96" rx="6" style="fill:#ede9fe"/>
  <text class="code" x="170" y="222">P4D</text>
  <rect class="ent" x="133" y="230" width="74" height="16"/><rect class="ent" x="133" y="248" width="74" height="16"/><rect class="ent" x="133" y="266" width="74" height="16" style="fill:#7c3aed"/><rect class="ent" x="133" y="284" width="74" height="12"/>

  <rect class="tb" x="230" y="206" width="90" height="96" rx="6" style="fill:#fce7f3"/>
  <text class="code" x="275" y="222">PUD</text>
  <rect class="ent" x="238" y="230" width="74" height="16" style="fill:#db2777"/><rect class="ent" x="238" y="248" width="74" height="16"/><rect class="ent" x="238" y="266" width="74" height="16"/><rect class="ent" x="238" y="284" width="74" height="12"/>

  <rect class="tb" x="335" y="206" width="90" height="96" rx="6" style="fill:#fef3c7"/>
  <text class="code" x="380" y="222">PMD</text>
  <rect class="ent" x="343" y="230" width="74" height="16"/><rect class="ent" x="343" y="248" width="74" height="16" style="fill:#d97706"/><rect class="ent" x="343" y="266" width="74" height="16"/><rect class="ent" x="343" y="284" width="74" height="12"/>

  <rect class="tb" x="440" y="206" width="90" height="96" rx="6" style="fill:#dcfce7"/>
  <text class="code" x="485" y="222">PTE</text>
  <rect class="ent" x="448" y="230" width="74" height="16" style="fill:#16a34a"/><rect class="ent" x="448" y="248" width="74" height="16"/><rect class="ent" x="448" y="266" width="74" height="16"/><rect class="ent" x="448" y="284" width="74" height="12"/>

  <g stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <path d="M102,256 L123,256"/>
    <path d="M207,274 L228,238"/>
    <path d="M312,238 L333,256"/>
    <path d="M417,256 L438,238"/>
  </g>
  <path d="M522,238 L670,238 L670,172" stroke="#14a37f" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <text class="lb" x="560" y="230">mục hợp lệ</text>

  <text class="sc" x="65" y="320">mỗi process</text><text class="sc" x="65" y="336">một PGD</text>
  <text class="sc" x="170" y="320">gộp khi</text><text class="sc" x="170" y="336">chỉ có 4 cấp</text>
  <text class="sc" x="327" y="320">huge page: mục PUD/PMD</text><text class="sc" x="327" y="336">có thể trỏ thẳng vùng lớn</text>
  <text class="sc" x="485" y="320">mục cuối: khung</text><text class="sc" x="485" y="336">+ quyền, dirty</text>

  <!-- Page fault -->
  <path d="M522,290 L600,290 L600,360" stroke="#e08a00" stroke-width="1.6" fill="none" marker-end="url(#o)"/>
  <text class="lb" x="608" y="300">không present</text>
  <text class="lb" x="608" y="316">hoặc sai quyền</text>
  <rect class="flt" x="440" y="362" width="300" height="34" rx="8"/>
  <text class="c" x="590" y="384">page fault → kernel: handle_mm_fault()</text>

  <g stroke="#e08a00" stroke-width="1.3" fill="none" marker-end="url(#o)">
    <path d="M460,396 L250,418"/>
    <path d="M520,396 L470,418"/>
    <path d="M660,396 L660,418"/>
  </g>
  <rect class="out" x="20" y="420" width="250" height="44" rx="8"/>
  <text class="c" x="145" y="438">lazy alloc, copy-on-write</text>
  <text class="sc" x="145" y="455">cấp khung, sửa mục (minor fault)</text>
  <rect class="out" x="285" y="420" width="250" height="44" rx="8"/>
  <text class="c" x="410" y="438">trang đã bị đẩy ra swap</text>
  <text class="sc" x="410" y="455">đọc lại từ đĩa (major fault)</text>
  <rect class="out" x="550" y="420" width="190" height="44" rx="8"/>
  <text class="c" x="645" y="438">truy cập không hợp lệ</text>
  <text class="sc" x="645" y="455">SIGSEGV</text>

  <text class="s" x="20" y="482">Sửa xong page table thì lệnh chạy lại và bản dịch được nạp vào TLB. Mỗi cấp của page walk là một lần đọc bộ nhớ.</text>
</svg>
