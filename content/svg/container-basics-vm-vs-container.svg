<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">VM: hypervisor chia phần cứng, mỗi VM boot hệ điều hành và kernel riêng. Container: process trên một kernel chung, cách ly bằng namespace, giới hạn bằng cgroup</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <style>
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .vm { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .ct { fill: #eef6ff; stroke: #3b7ff5; stroke-width: 1.3; stroke-dasharray: 5 3; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.1; }
      .krn { fill: #fff3db; stroke: #e08a00; stroke-width: 1.4; }
      .hyp { fill: #eef2f7; stroke: #64748b; stroke-width: 1.2; }
      .hw { fill: #e5e7eb; stroke: #94a3b8; stroke-width: 1.1; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .c { font-size: 12.5px; fill: #1f2937; text-anchor: middle; }
      .sc { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .bl { font-size: 11.5px; fill: #1d4ed8; }
      .ok { font-size: 12.5px; fill: #0f7a5f; }
      .no { font-size: 12.5px; fill: #c2410c; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- VM -->
  <rect class="grp" x="20" y="16" width="350" height="290" rx="12"/>
  <text class="h" x="36" y="40">VM · mỗi VM một kernel</text>
  <rect class="vm" x="36" y="52" width="98" height="156" rx="8"/>
  <text class="sc" x="85" y="68">VM 1</text>
  <rect class="box" x="44" y="76" width="82" height="26" rx="5"/><text class="c" x="85" y="94">App</text>
  <rect class="box" x="44" y="108" width="82" height="26" rx="5"/><text class="c" x="85" y="126">Thư viện</text>
  <rect class="box" x="44" y="140" width="82" height="26" rx="5"/><text class="c" x="85" y="158">Guest OS</text>
  <rect class="krn" x="44" y="172" width="82" height="26" rx="5"/><text class="c" x="85" y="190">kernel</text>
  <rect class="vm" x="146" y="52" width="98" height="156" rx="8"/>
  <text class="sc" x="195" y="68">VM 2</text>
  <rect class="box" x="154" y="76" width="82" height="26" rx="5"/><text class="c" x="195" y="94">App</text>
  <rect class="box" x="154" y="108" width="82" height="26" rx="5"/><text class="c" x="195" y="126">Thư viện</text>
  <rect class="box" x="154" y="140" width="82" height="26" rx="5"/><text class="c" x="195" y="158">Guest OS</text>
  <rect class="krn" x="154" y="172" width="82" height="26" rx="5"/><text class="c" x="195" y="190">kernel</text>
  <rect class="vm" x="256" y="52" width="98" height="156" rx="8"/>
  <text class="sc" x="305" y="68">VM 3</text>
  <rect class="box" x="264" y="76" width="82" height="26" rx="5"/><text class="c" x="305" y="94">App</text>
  <rect class="box" x="264" y="108" width="82" height="26" rx="5"/><text class="c" x="305" y="126">Thư viện</text>
  <rect class="box" x="264" y="140" width="82" height="26" rx="5"/><text class="c" x="305" y="158">Guest OS</text>
  <rect class="krn" x="264" y="172" width="82" height="26" rx="5"/><text class="c" x="305" y="190">kernel</text>
  <rect class="hyp" x="36" y="218" width="318" height="38" rx="7"/>
  <text class="c" x="195" y="234">Hypervisor</text>
  <text class="sc" x="195" y="249">cho mỗi VM CPU, RAM, đĩa ảo để boot OS</text>
  <rect class="hw" x="36" y="264" width="318" height="28" rx="6"/><text class="c" x="195" y="283">Phần cứng</text>

  <!-- Container -->
  <rect class="grp" x="390" y="16" width="350" height="290" rx="12"/>
  <text class="h" x="406" y="40">Container · một kernel chung</text>
  <text class="bl" x="406" y="66">Khung nét đứt: một bộ namespace riêng</text>
  <text class="bl" x="406" y="84">(PID, mạng, mount, hostname…) + một cgroup</text>
  <rect class="ct" x="406" y="100" width="98" height="98" rx="8"/>
  <text class="sc" x="455" y="116">container 1</text>
  <rect class="box" x="414" y="124" width="82" height="26" rx="5"/><text class="c" x="455" y="142">App</text>
  <rect class="box" x="414" y="156" width="82" height="26" rx="5"/><text class="c" x="455" y="174">Thư viện</text>
  <rect class="ct" x="516" y="100" width="98" height="98" rx="8"/>
  <text class="sc" x="565" y="116">container 2</text>
  <rect class="box" x="524" y="124" width="82" height="26" rx="5"/><text class="c" x="565" y="142">App</text>
  <rect class="box" x="524" y="156" width="82" height="26" rx="5"/><text class="c" x="565" y="174">Thư viện</text>
  <rect class="ct" x="626" y="100" width="98" height="98" rx="8"/>
  <text class="sc" x="675" y="116">container 3</text>
  <rect class="box" x="634" y="124" width="82" height="26" rx="5"/><text class="c" x="675" y="142">App</text>
  <rect class="box" x="634" y="156" width="82" height="26" rx="5"/><text class="c" x="675" y="174">Thư viện</text>
  <rect class="krn" x="406" y="210" width="318" height="46" rx="7"/>
  <text class="c" x="565" y="229">Linux kernel của host · một kernel cho tất cả</text>
  <text class="sc" x="565" y="246">namespace che tầm nhìn · cgroup giới hạn CPU, RAM, IO</text>
  <rect class="hw" x="406" y="264" width="318" height="28" rx="6"/><text class="c" x="565" y="283">Phần cứng (hoặc một VM của cloud)</text>

  <text class="ok" x="20" y="330">✓ cách ly mạnh: ranh giới hypervisor</text>
  <text class="no" x="20" y="350">✗ mỗi VM boot cả OS, image cỡ GB</text>
  <text class="ok" x="390" y="330">✓ khởi động gần bằng một process, cỡ MB</text>
  <text class="no" x="390" y="350">✗ lỗ hổng kernel chạm mọi container</text>
  <text class="s" x="20" y="376">Hai cách thường đi cùng nhau: cloud chạy container trong VM hoặc micro-VM (Fargate, Firecracker).</text>
</svg>
