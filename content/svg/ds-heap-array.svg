<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Min-heap là cây nhị phân hoàn chỉnh lưu trong mảng: con của ô i ở 2i+1 và 2i+2, min luôn ở heap[0]</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ff5"/></marker>
    <style>
      .nd { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .root { fill: #e4f5ef; stroke: #14a37f; stroke-width: 1.8; }
      .sel { fill: #e8f0fe; stroke: #3b7ff5; stroke-width: 1.8; }
      .cell { fill: #ffffff; stroke: #94a3b8; }
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .v { font-size: 15px; font-weight: 650; fill: #1f2937; text-anchor: middle; }
      .ix { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1f2937; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <text class="h" x="20" y="30">Nhìn như cây</text>
  <g stroke="#94a3b8" stroke-width="1.4">
    <path d="M210,60 L120,128"/><path d="M210,60 L300,128"/>
    <path d="M120,128 L75,196"/><path d="M120,128 L165,196"/>
    <path d="M300,128 L255,196"/><path d="M300,128 L345,196"/>
  </g>
  <circle class="root" cx="210" cy="60" r="20"/><text class="v" x="210" y="65">1</text><text class="ix" x="242" y="52">[0]</text>
  <circle class="sel" cx="120" cy="128" r="20"/><text class="v" x="120" y="133">3</text><text class="ix" x="88" y="120">[1]</text>
  <circle class="nd" cx="300" cy="128" r="20"/><text class="v" x="300" y="133">2</text><text class="ix" x="332" y="120">[2]</text>
  <circle class="sel" cx="75" cy="196" r="20"/><text class="v" x="75" y="201">7</text><text class="ix" x="75" y="232">[3]</text>
  <circle class="sel" cx="165" cy="196" r="20"/><text class="v" x="165" y="201">4</text><text class="ix" x="165" y="232">[4]</text>
  <circle class="nd" cx="255" cy="196" r="20"/><text class="v" x="255" y="201">5</text><text class="ix" x="255" y="232">[5]</text>
  <circle class="nd" cx="345" cy="196" r="20"/><text class="v" x="345" y="201">6</text><text class="ix" x="345" y="232">[6]</text>

  <!-- Quy tắc -->
  <rect class="grp" x="420" y="40" width="320" height="168" rx="12"/>
  <text class="h" x="436" y="64">Lưu thật trong mảng</text>
  <text class="code" x="436" y="92">con của i:  2i+1 và 2i+2</text>
  <text class="code" x="436" y="116">cha của i:  (i−1) // 2</text>
  <text class="code" x="436" y="140">heap[i] ≤ cả hai con</text>
  <text class="s" x="436" y="166">→ min luôn ở heap[0], peek O(1)</text>
  <text class="s" x="436" y="186">không cần con trỏ: vị trí trong mảng</text>
  <text class="s" x="436" y="202">tự cho biết cha và con</text>

  <!-- Mảng -->
  <text class="h" x="20" y="282">Mảng thật</text>
  <rect class="root" x="200" y="264" width="56" height="34"/><text class="v" x="228" y="287">1</text>
  <rect class="sel" x="256" y="264" width="56" height="34"/><text class="v" x="284" y="287">3</text>
  <rect class="cell" x="312" y="264" width="56" height="34"/><text class="v" x="340" y="287">2</text>
  <rect class="sel" x="368" y="264" width="56" height="34"/><text class="v" x="396" y="287">7</text>
  <rect class="sel" x="424" y="264" width="56" height="34"/><text class="v" x="452" y="287">4</text>
  <rect class="cell" x="480" y="264" width="56" height="34"/><text class="v" x="508" y="287">5</text>
  <rect class="cell" x="536" y="264" width="56" height="34"/><text class="v" x="564" y="287">6</text>
  <text class="ix" x="228" y="258">0</text><text class="ix" x="284" y="258">1</text><text class="ix" x="340" y="258">2</text><text class="ix" x="396" y="258">3</text><text class="ix" x="452" y="258">4</text><text class="ix" x="508" y="258">5</text><text class="ix" x="564" y="258">6</text>
  <g stroke="#3b7ff5" stroke-width="1.5" fill="none" marker-end="url(#b)">
    <path d="M284,298 C284,328 392,328 396,302"/>
    <path d="M290,298 C300,342 448,342 452,302"/>
  </g>
  <text class="s" x="604" y="286" style="fill:#1d4ed8">ô 1 → con ở ô 3, 4</text>

  <text class="t" x="20" y="358">push: thêm vào cuối mảng rồi đổi chỗ với cha cho tới khi đúng thứ tự (sift up).</text>
  <text class="t" x="20" y="380">pop: lấy heap[0], đưa phần tử cuối lên gốc rồi đẩy xuống (sift down). Cả hai chỉ đi một đường cao log n.</text>
</svg>
