<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Bloom filter 12 bit, 3 hàm hash: thêm hai phần tử, một query âm chắc chắn và một false positive</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ff5"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14a37f"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a00"/></marker>
    <style>
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 1.2; }
      .on { fill: #fff3db; stroke: #e08a00; stroke-width: 1.2; }
      .off { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .ix { font-size: 11.5px; fill: #64748b; }
      .v { font-size: 16px; font-weight: 650; fill: #1f2937; text-anchor: middle; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .c { font-size: 13px; fill: #1f2937; text-anchor: middle; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .ok { font-size: 12.5px; fill: #0f7a5f; }
      .warn { font-size: 12.5px; fill: #b45309; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <text class="h" x="20" y="28">Mảng m = 12 bit, k = 3 hàm hash</text>

  <!-- Thêm -->
  <rect class="box" x="110" y="44" width="110" height="30" rx="8" style="stroke:#3b7ff5;stroke-width:1.6"/>
  <text class="c" x="165" y="64">thêm a.com</text>
  <text class="s" x="228" y="64">→ bit 1, 4, 9</text>
  <rect class="box" x="440" y="44" width="110" height="30" rx="8" style="stroke:#14a37f;stroke-width:1.6"/>
  <text class="c" x="495" y="64">thêm b.com</text>
  <text class="s" x="558" y="64">→ bit 3, 4, 10</text>
  <g stroke="#3b7ff5" stroke-width="1.4" fill="none" marker-end="url(#b)">
    <path d="M150,74 L164,147"/><path d="M175,74 L306,147"/><path d="M200,74 L546,147"/>
  </g>
  <g stroke="#14a37f" stroke-width="1.4" fill="none" marker-end="url(#g)">
    <path d="M470,74 L262,147"/><path d="M490,74 L310,147"/><path d="M520,74 L596,147"/>
  </g>

  <!-- Mảng bit -->
  <rect class="off" x="92" y="150" width="48" height="44"/><text class="ix" x="97" y="163">0</text><text class="v" x="116" y="184">0</text>
  <rect class="on" x="140" y="150" width="48" height="44"/><text class="ix" x="145" y="163">1</text><text class="v" x="164" y="184">1</text>
  <rect class="off" x="188" y="150" width="48" height="44" style="stroke:#e0562b;stroke-width:2"/><text class="ix" x="193" y="163">2</text><text class="v" x="212" y="184">0</text>
  <rect class="on" x="236" y="150" width="48" height="44"/><text class="ix" x="241" y="163">3</text><text class="v" x="260" y="184">1</text>
  <rect class="on" x="284" y="150" width="48" height="44"/><text class="ix" x="289" y="163">4</text><text class="v" x="308" y="184">1</text>
  <rect class="off" x="332" y="150" width="48" height="44"/><text class="ix" x="337" y="163">5</text><text class="v" x="356" y="184">0</text>
  <rect class="off" x="380" y="150" width="48" height="44"/><text class="ix" x="385" y="163">6</text><text class="v" x="404" y="184">0</text>
  <rect class="off" x="428" y="150" width="48" height="44"/><text class="ix" x="433" y="163">7</text><text class="v" x="452" y="184">0</text>
  <rect class="off" x="476" y="150" width="48" height="44"/><text class="ix" x="481" y="163">8</text><text class="v" x="500" y="184">0</text>
  <rect class="on" x="524" y="150" width="48" height="44"/><text class="ix" x="529" y="163">9</text><text class="v" x="548" y="184">1</text>
  <rect class="on" x="572" y="150" width="48" height="44"/><text class="ix" x="577" y="163">10</text><text class="v" x="596" y="184">1</text>
  <rect class="off" x="620" y="150" width="48" height="44"/><text class="ix" x="625" y="163">11</text><text class="v" x="644" y="184">0</text>

  <!-- Hỏi -->
  <g stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#k)">
    <path d="M190,262 L212,197"/><path d="M215,262 L306,197"/><path d="M240,262 L546,197"/>
  </g>
  <g stroke="#e08a00" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#o)">
    <path d="M500,262 L166,197"/><path d="M520,262 L262,197"/><path d="M560,262 L596,197"/>
  </g>
  <rect class="box" x="150" y="262" width="120" height="30" rx="8"/>
  <text class="c" x="210" y="282">có c.com?</text>
  <rect class="box" x="470" y="262" width="120" height="30" rx="8" style="stroke:#e08a00;stroke-width:1.6"/>
  <text class="c" x="530" y="282">có d.com?</text>
  <text class="ok" x="20" y="318">c.com → bit 2, 4, 9: bit 2 = 0 → chắc chắn chưa có (không có false negative)</text>
  <text class="warn" x="20" y="338">d.com → bit 1, 3, 10: đều = 1 do a.com, b.com bật → báo “có thể có” dù chưa thêm (false positive)</text>

  <text class="t" x="20" y="366">Không xoá được: tắt bit 4 để xoá a.com sẽ làm hỏng luôn b.com.</text>
  <text class="s" x="20" y="384">Redis: sai số 1% cần 7 hàm hash và ~9,6 bit mỗi phần tử, bất kể phần tử dài bao nhiêu.</text>
</svg>
