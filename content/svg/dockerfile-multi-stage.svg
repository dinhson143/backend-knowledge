<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Multi-stage: stage build có compiler, source và dev dependency; chỉ node_modules runtime và dist được COPY sang stage chạy distroless, chạy bằng UID không phải root</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14a37f"/></marker>
    <style>
      .bld { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .run { fill: #eef6ff; stroke: #3b7ff5; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; }
      .keep { fill: #e4f5ef; stroke: #14a37f; stroke-width: 1.4; }
      .rt { fill: #ffffff; stroke: #3b7ff5; stroke-width: 1.1; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #475569; }
      .l { font-size: 12.5px; fill: #1f2937; }
      .lm { font-size: 12.5px; fill: #64748b; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .ok { font-size: 11.5px; fill: #0f7a5f; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- Stage build -->
  <rect class="bld" x="20" y="16" width="310" height="284" rx="12"/>
  <text class="h" x="36" y="40">Stage build</text>
  <text class="code" x="36" y="58">FROM node:22-slim@sha256:… AS build</text>
  <rect class="box" x="36" y="70" width="278" height="28" rx="6"/><text class="lm" x="48" y="89">package.json, package-lock.json</text>
  <rect class="box" x="36" y="104" width="278" height="28" rx="6"/><text class="lm" x="48" y="123">src/ (TypeScript)</text>
  <rect class="box" x="36" y="138" width="278" height="28" rx="6"/><text class="lm" x="48" y="157">npm, shell, apt, công cụ build</text>
  <rect class="keep" x="36" y="172" width="278" height="28" rx="6"/><text class="l" x="48" y="191">node_modules (sau npm prune: chỉ runtime)</text>
  <rect class="keep" x="36" y="206" width="278" height="28" rx="6"/><text class="l" x="48" y="225">dist/ (JS đã build)</text>
  <text class="s" x="36" y="256">Dev dependency đã bị prune trong stage này;</text>
  <text class="s" x="36" y="272">cache npm nằm ở cache mount, không vào layer.</text>
  <text class="s" x="36" y="290">Xám: ở lại, không vào image cuối.</text>

  <!-- Copy -->
  <g stroke="#14a37f" stroke-width="1.6" fill="none" marker-end="url(#g)">
    <path d="M314,186 C380,186 380,134 446,134"/>
    <path d="M314,220 C380,220 380,168 446,168"/>
  </g>
  <text class="ok" x="380" y="246" text-anchor="middle">COPY</text>
  <text class="ok" x="380" y="262" text-anchor="middle">--from=build</text>

  <!-- Stage runtime -->
  <rect class="run" x="430" y="16" width="310" height="284" rx="12"/>
  <text class="h" x="446" y="40">Stage chạy = image cuối</text>
  <text class="code" x="446" y="58">FROM gcr.io/distroless/nodejs22-debian13</text>
  <rect class="rt" x="448" y="70" width="276" height="44" rx="6"/>
  <text class="l" x="460" y="88">Node runtime của distroless</text>
  <text class="s" x="460" y="105">không shell, không package manager</text>
  <rect class="keep" x="448" y="120" width="276" height="28" rx="6"/><text class="l" x="460" y="139">node_modules</text>
  <rect class="keep" x="448" y="154" width="276" height="28" rx="6"/><text class="l" x="460" y="173">dist/</text>
  <rect class="rt" x="448" y="188" width="276" height="28" rx="6"/><text class="code" x="460" y="207">USER 10001:10001 · không phải root</text>
  <rect class="rt" x="448" y="222" width="276" height="28" rx="6"/><text class="code" x="460" y="241">EXPOSE 8080 · chỉ là ghi chú</text>
  <rect class="rt" x="448" y="256" width="276" height="28" rx="6"/><text class="code" x="460" y="275">CMD ["dist/server.js"] · exec form</text>

  <text class="t" x="20" y="328">Image cuối chỉ gồm layer của stage cuối: base distroless + đúng hai thứ được COPY sang.</text>
  <text class="t" x="20" y="348">Source, compiler, npm và dev dependency ở lại stage build nên không làm image to hay thêm CVE.</text>
  <text class="s" x="20" y="374">BuildKit chỉ build các stage mà stage đích cần. Base pin theo digest (@sha256:…) để build tái lập được.</text>
</svg>
