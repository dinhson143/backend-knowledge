<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Count-Min Sketch 3 hàng × 8 cột: mỗi phần tử cộng vào một ô mỗi hàng, query lấy min nên chỉ có thể đếm dư</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <style>
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .z { fill: #ffffff; stroke: #cbd5e1; }
      .nz { fill: #eef2f7; stroke: #94a3b8; }
      .v { font-size: 15px; font-weight: 650; fill: #1f2937; text-anchor: middle; }
      .rl { font-size: 13px; fill: #64748b; text-anchor: end; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .ok { font-size: 13px; fill: #0f7a5f; }
      .no { font-size: 13px; fill: #c2410c; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1f2937; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <text class="h" x="20" y="30">d = 3 hàng (mỗi hàng một hàm hash) × w = 8 cột bộ đếm</text>
  <text class="s" x="20" y="50">Thêm phần tử: mỗi hàng hash ra một cột rồi cộng vào ô đó.</text>

  <!-- Stream -->
  <rect class="grp" x="20" y="70" width="160" height="120" rx="10"/>
  <text class="t" x="34" y="94">Stream đã thấy</text>
  <text class="code" x="34" y="120">A × 5</text>
  <text class="code" x="34" y="144">B × 2</text>
  <text class="code" x="34" y="168">C × 1</text>

  <!-- Bảng đếm -->
  <text class="rl" x="206" y="93">h₁</text>
  <rect class="z" x="220" y="70" width="52" height="36"/><text class="v" x="246" y="93">0</text>
  <rect class="nz" x="272" y="70" width="52" height="36"/><text class="v" x="298" y="93">7</text>
  <rect class="z" x="324" y="70" width="52" height="36"/><text class="v" x="350" y="93">0</text>
  <rect class="z" x="376" y="70" width="52" height="36"/><text class="v" x="402" y="93">0</text>
  <rect class="z" x="428" y="70" width="52" height="36"/><text class="v" x="454" y="93">0</text>
  <rect class="nz" x="480" y="70" width="52" height="36"/><text class="v" x="506" y="93">1</text>
  <rect class="z" x="532" y="70" width="52" height="36"/><text class="v" x="558" y="93">0</text>
  <rect class="z" x="584" y="70" width="52" height="36"/><text class="v" x="610" y="93">0</text>
  <text class="rl" x="206" y="135">h₂</text>
  <rect class="z" x="220" y="112" width="52" height="36"/><text class="v" x="246" y="135">0</text>
  <rect class="z" x="272" y="112" width="52" height="36"/><text class="v" x="298" y="135">0</text>
  <rect class="nz" x="324" y="112" width="52" height="36"/><text class="v" x="350" y="135">3</text>
  <rect class="z" x="376" y="112" width="52" height="36"/><text class="v" x="402" y="135">0</text>
  <rect class="nz" x="428" y="112" width="52" height="36"/><text class="v" x="454" y="135">5</text>
  <rect class="z" x="480" y="112" width="52" height="36"/><text class="v" x="506" y="135">0</text>
  <rect class="z" x="532" y="112" width="52" height="36"/><text class="v" x="558" y="135">0</text>
  <rect class="z" x="584" y="112" width="52" height="36"/><text class="v" x="610" y="135">0</text>
  <text class="rl" x="206" y="177">h₃</text>
  <rect class="z" x="220" y="154" width="52" height="36"/><text class="v" x="246" y="177">0</text>
  <rect class="z" x="272" y="154" width="52" height="36"/><text class="v" x="298" y="177">0</text>
  <rect class="z" x="324" y="154" width="52" height="36"/><text class="v" x="350" y="177">0</text>
  <rect class="nz" x="376" y="154" width="52" height="36"/><text class="v" x="402" y="177">2</text>
  <rect class="z" x="428" y="154" width="52" height="36"/><text class="v" x="454" y="177">0</text>
  <rect class="z" x="480" y="154" width="52" height="36"/><text class="v" x="506" y="177">0</text>
  <rect class="nz" x="532" y="154" width="52" height="36"/><text class="v" x="558" y="177">6</text>
  <rect class="z" x="584" y="154" width="52" height="36"/><text class="v" x="610" y="177">0</text>

  <!-- Ô của A (xanh) và D (cam) -->
  <g fill="none" stroke="#3b7ff5" stroke-width="2.4">
    <rect x="272" y="70" width="52" height="36"/><rect x="428" y="112" width="52" height="36"/><rect x="532" y="154" width="52" height="36"/>
  </g>
  <g fill="none" stroke="#e08a00" stroke-width="2" stroke-dasharray="4 3">
    <rect x="277" y="75" width="42" height="26"/><rect x="433" y="117" width="42" height="26"/><rect x="381" y="159" width="42" height="26"/>
  </g>
  <rect x="650" y="82" width="22" height="14" fill="none" stroke="#3b7ff5" stroke-width="2.4"/>
  <text class="s" x="678" y="94">ô của A</text>
  <rect x="650" y="112" width="22" height="14" fill="none" stroke="#e08a00" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="s" x="678" y="124">ô của D</text>
  <text class="s" x="650" y="152">ô 7 = A(5)</text>
  <text class="s" x="650" y="168">+ B(2) va chạm</text>

  <!-- Query -->
  <text class="h" x="20" y="226">Query = min của d ô</text>
  <text class="ok" x="20" y="250">A: min(7, 5, 6) = 5 ✓ đúng — có hàng không bị va chạm</text>
  <text class="ok" x="20" y="272">B: min(7, 3, 2) = 2 ✓ · C: min(1, 3, 6) = 1 ✓</text>
  <text class="no" x="20" y="294">D chưa từng xuất hiện: min(7, 5, 2) = 2 ✗ đếm dư vì cả 3 ô đều trùng phần tử khác</text>

  <text class="t" x="20" y="330">Va chạm chỉ cộng thêm, không bao giờ trừ → mỗi ô ≥ số đếm thật, min là ước lượng tốt nhất.</text>
  <text class="t" x="20" y="352">Bộ nhớ cố định w × d bất kể có bao nhiêu phần tử; số nhỏ dễ sai nên chỉ tin phần tử đếm cao (heavy hitter).</text>
  <text class="s" x="20" y="374">Redis CMS.INITBYPROB: error quyết định w, probability quyết định d.</text>
</svg>
