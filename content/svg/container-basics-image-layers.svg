<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Image gồm các layer chỉ đọc dùng chung; mỗi container thêm một layer ghi được ở trên cùng, sửa file thì copy lên layer đó (copy-on-write)</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a00"/></marker>
    <style>
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .rw { fill: #fff3db; stroke: #e08a00; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .ro { fill: #e8f0fe; stroke: #3b7ff5; stroke-width: 1.2; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .c { font-size: 12.5px; fill: #1f2937; text-anchor: middle; }
      .sc { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .l { font-size: 12.5px; fill: #1f2937; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .lo { font-size: 11.5px; fill: #b45309; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #64748b; text-anchor: end; }
      .n { font-size: 12.5px; font-weight: 650; fill: #1f2937; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="398" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- Container layers -->
  <rect class="grp" x="20" y="16" width="476" height="290" rx="12"/>
  <text class="h" x="36" y="40">Hai container chạy từ cùng image web:1.4</text>
  <rect class="rw" x="36" y="54" width="214" height="46" rx="7"/>
  <text class="c" x="143" y="73">Container A · layer ghi được</text>
  <text class="sc" x="143" y="91">config.json (bản đã sửa)</text>
  <rect class="rw" x="266" y="54" width="214" height="46" rx="7"/>
  <text class="c" x="373" y="73">Container B · layer ghi được</text>
  <text class="sc" x="373" y="91">tmp/upload-1.png (file mới)</text>

  <text class="s" x="36" y="128">Image · các layer chỉ đọc, A và B dùng chung, chỉ lưu một lần</text>
  <rect class="ro" x="36" y="138" width="444" height="36" rx="6"/>
  <text class="l" x="48" y="161">Layer 3 · COPY app/ (có config.json)</text>
  <text class="code" x="470" y="161">sha256:7c1e…</text>
  <rect class="ro" x="36" y="180" width="444" height="36" rx="6"/>
  <text class="l" x="48" y="203">Layer 2 · RUN npm ci (node_modules)</text>
  <text class="code" x="470" y="203">sha256:a93f…</text>
  <rect class="ro" x="36" y="222" width="444" height="36" rx="6"/>
  <text class="l" x="48" y="245">Layer 1 · base image (Debian slim)</text>
  <text class="code" x="470" y="245">sha256:51d0…</text>

  <path d="M48,150 C24,140 24,92 34,86" stroke="#e08a00" stroke-width="1.6" fill="none" marker-end="url(#o)"/>
  <text class="lo" x="36" y="278">↑ A sửa config.json lần đầu: copy cả file lên layer của A rồi sửa bản copy.</text>
  <text class="lo" x="36" y="296">Bản trong Layer 3 không đổi; B vẫn đọc bản gốc.</text>

  <!-- Rules -->
  <text class="n" x="516" y="40">Quy tắc</text>
  <text class="t" x="516" y="66">1. Đọc file chưa sửa: dùng thẳng</text>
  <text class="t" x="530" y="84">bản ở layer dưới, không copy.</text>
  <text class="t" x="516" y="112">2. Ghi lần đầu: copy-on-write,</text>
  <text class="t" x="530" y="130">copy file lên layer ghi được.</text>
  <text class="t" x="516" y="158">3. Xoá container: mất layer ghi</text>
  <text class="t" x="530" y="176">được, image không đổi.</text>
  <text class="t" x="516" y="204">4. Layer định danh bằng digest</text>
  <text class="t" x="530" y="222">(hash nội dung): layer giống nhau</text>
  <text class="t" x="530" y="240">chỉ lưu và tải một lần.</text>

  <text class="t" x="20" y="334">Dữ liệu cần giữ (upload, database) đặt ở volume hoặc dịch vụ ngoài, không ghi vào layer của container.</text>
  <text class="s" x="20" y="358">Docker Engine 29+ mặc định lưu image bằng containerd (snapshotter) thay cho storage driver cũ;</text>
  <text class="s" x="20" y="376">khái niệm layer chỉ đọc + layer ghi được vẫn như trên. Digest trong hình là minh hoạ.</text>
</svg>
