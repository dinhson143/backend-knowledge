<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Deployment sở hữu ReplicaSet v1 và v2 khi rolling update; Service chọn pod theo label nên gồm cả v1 và v2; HTTPRoute gắn vào Gateway và trỏ tới Service</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ff5"/></marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .rs1 { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
      .rs2 { fill: #eef6ff; stroke: #3b7ff5; stroke-width: 1.3; }
      .ready { fill: #e4f5ef; stroke: #14a37f; stroke-width: 1.3; }
      .wait { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .net { fill: #fff7eb; stroke: #e08a00; stroke-width: 1.3; }
      .own { stroke: #64748b; stroke-width: 1.3; fill: none; }
      .sel { stroke: #14a37f; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
      .ref { stroke: #3b7ff5; stroke-width: 1.5; fill: none; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .c { font-size: 12.5px; fill: #1f2937; text-anchor: middle; }
      .sc { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1f2937; text-anchor: middle; }
      .bl { font-size: 11.5px; fill: #1d4ed8; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <text class="h" x="20" y="34">Workload: Deployment → ReplicaSet → Pod</text>
  <text class="h" x="560" y="34">Đưa traffic vào</text>

  <!-- Deployment -->
  <rect class="box" x="20" y="150" width="150" height="62" rx="8"/>
  <text class="c" x="95" y="170">Deployment web</text>
  <text class="code" x="95" y="188">replicas: 4</text>
  <text class="code" x="95" y="204">app=web</text>

  <!-- ReplicaSets -->
  <rect class="rs1" x="200" y="60" width="160" height="62" rx="8"/>
  <text class="c" x="280" y="80">ReplicaSet v1 (cũ)</text>
  <text class="code" x="280" y="98">image web:1.4</text>
  <text class="sc" x="280" y="114">đang giảm: 2 pod</text>
  <rect class="rs2" x="200" y="226" width="160" height="62" rx="8"/>
  <text class="c" x="280" y="246">ReplicaSet v2 (mới)</text>
  <text class="code" x="280" y="264">image web:1.5</text>
  <text class="sc" x="280" y="280">đang tăng: 3 pod</text>
  <g class="own" marker-end="url(#a)">
    <path d="M170,170 L198,104"/><path d="M170,194 L198,244"/>
  </g>

  <!-- Pods -->
  <rect class="ready" x="390" y="60" width="130" height="28" rx="6"/><text class="code" x="455" y="78">app=web · v1</text>
  <rect class="ready" x="390" y="96" width="130" height="28" rx="6"/><text class="code" x="455" y="114">app=web · v1</text>
  <rect class="ready" x="390" y="206" width="130" height="28" rx="6"/><text class="code" x="455" y="224">app=web · v2</text>
  <rect class="wait" x="390" y="242" width="130" height="28" rx="6"/><text class="code" x="455" y="260">app=web · v2</text>
  <rect class="wait" x="390" y="278" width="130" height="28" rx="6"/><text class="code" x="455" y="296">app=web · v2</text>
  <g class="own" marker-end="url(#a)">
    <path d="M360,84 L388,74"/><path d="M360,98 L388,110"/>
    <path d="M360,248 L388,220"/><path d="M360,257 L388,256"/><path d="M360,266 L388,292"/>
  </g>

  <!-- Selector bracket -->
  <path class="sel" d="M522,74 L540,74 L540,292 L522,292 M522,110 L540,110 M522,220 L540,220 M522,256 L540,256"/>
  <path class="sel" d="M540,218 L558,218"/>

  <!-- Gateway side -->
  <rect class="net" x="560" y="50" width="180" height="44" rx="8"/>
  <text class="c" x="650" y="68">Gateway</text><text class="sc" x="650" y="85">listener HTTPS :443</text>
  <rect class="box" x="560" y="122" width="180" height="62" rx="8"/>
  <text class="c" x="650" y="142">HTTPRoute</text>
  <text class="sc" x="650" y="159">parentRefs → Gateway</text>
  <text class="sc" x="650" y="175">backendRefs → web:80</text>
  <rect class="box" x="560" y="196" width="180" height="44" rx="8"/>
  <text class="c" x="650" y="214">Service web</text><text class="code" x="650" y="231">selector app=web</text>
  <rect class="box" x="560" y="262" width="180" height="62" rx="8"/>
  <text class="c" x="650" y="282">EndpointSlice</text>
  <text class="sc" x="650" y="299">5 endpoint, 3 có ready</text>
  <text class="sc" x="650" y="315">(2 v1 + 1 v2)</text>
  <g class="ref" marker-end="url(#b)">
    <path d="M596,122 L596,96"/><path d="M704,184 L704,194"/>
  </g>
  <path class="own" d="M650,240 L650,260" marker-end="url(#a)"/>

  <!-- Notes -->
  <text class="t" x="20" y="352">Service chọn pod theo label, không theo ReplicaSet: lúc rolling update, traffic tới cả pod v1 và v2.</text>
  <text class="t" x="20" y="372">Chỉ endpoint có ready (pod Ready, không đang dừng) mới nhận traffic; hai pod v2 nét đứt thì chưa.</text>
  <text class="s" x="20" y="394">Mỗi ReplicaSet có thêm label pod-template-hash trong selector nên v1, v2 không giành pod của nhau.</text>
  <text class="s" x="20" y="410">4 replica, mặc định maxSurge = maxUnavailable = 25%: tối đa 5 pod, ít nhất 3 pod sẵn sàng.</text>

  <!-- Legend -->
  <path class="own" d="M20,440 L48,440" marker-end="url(#a)"/><text class="s" x="54" y="444">sở hữu / tạo</text>
  <path class="sel" d="M150,440 L178,440"/><text class="s" x="184" y="444">chọn theo label</text>
  <path class="ref" d="M300,440 L328,440" marker-end="url(#b)"/><text class="s" x="334" y="444">tham chiếu (parentRefs, backendRefs)</text>
  <rect class="wait" x="560" y="430" width="22" height="16" rx="4"/><text class="s" x="588" y="443">pod chưa Ready</text>
</svg>
