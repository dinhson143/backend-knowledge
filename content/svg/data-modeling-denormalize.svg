<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Chuẩn hoá và phi chuẩn hoá: đọc phải JOIN hay không, và đổi tên venue phải sửa bao nhiêu dòng</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <style>
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .th { fill: #eef2f7; stroke: #cbd5e1; }
      .td { fill: #ffffff; stroke: #cbd5e1; }
      .hit { fill: #e4f5ef; stroke: #14a37f; }
      .bad { fill: #fde8e1; stroke: #e0562b; }
      .hd { font-size: 11.5px; font-weight: 600; fill: #475569; }
      .tdt { font-size: 12.5px; fill: #1f2937; }
      .tn { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #64748b; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .t { font-size: 13px; fill: #1f2937; }
      .s { font-size: 11.5px; fill: #64748b; }
      .ok { font-size: 12.5px; fill: #0f7a5f; }
      .no { font-size: 12.5px; fill: #c2410c; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- Chuẩn hoá -->
  <rect class="grp" x="20" y="16" width="352" height="310" rx="12"/>
  <text class="h" x="36" y="40">Chuẩn hoá (normalize)</text>
  <text class="tn" x="36" y="64">venues</text>
  <rect class="th" x="36" y="70" width="40" height="22"/><text class="hd" x="42" y="85">id</text>
  <rect class="th" x="76" y="70" width="130" height="22"/><text class="hd" x="82" y="85">name</text>
  <rect class="hit" x="36" y="92" width="40" height="24"/><text class="tdt" x="42" y="109">7</text>
  <rect class="hit" x="76" y="92" width="130" height="24"/><text class="tdt" x="82" y="109">Nhà hát Lớn</text>
  <text class="tn" x="36" y="138">events</text>
  <rect class="th" x="36" y="144" width="40" height="22"/><text class="hd" x="42" y="159">id</text>
  <rect class="th" x="76" y="144" width="110" height="22"/><text class="hd" x="82" y="159">name</text>
  <rect class="th" x="186" y="144" width="80" height="22"/><text class="hd" x="192" y="159">venue_id</text>
  <rect class="td" x="36" y="166" width="40" height="24"/><text class="tdt" x="42" y="183">1</text>
  <rect class="td" x="76" y="166" width="110" height="24"/><text class="tdt" x="82" y="183">Hòa nhạc</text>
  <rect class="td" x="186" y="166" width="80" height="24"/><text class="tdt" x="192" y="183">7</text>
  <rect class="td" x="36" y="190" width="40" height="24"/><text class="tdt" x="42" y="207">2</text>
  <rect class="td" x="76" y="190" width="110" height="24"/><text class="tdt" x="82" y="207">Kịch</text>
  <rect class="td" x="186" y="190" width="80" height="24"/><text class="tdt" x="192" y="207">7</text>
  <rect class="td" x="36" y="214" width="40" height="24"/><text class="tdt" x="42" y="231">3</text>
  <rect class="td" x="76" y="214" width="110" height="24"/><text class="tdt" x="82" y="231">Ballet</text>
  <rect class="td" x="186" y="214" width="80" height="24"/><text class="tdt" x="192" y="231">7</text>
  <path d="M266,178 C310,178 310,104 210,104" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
  <text class="s" x="304" y="145">FK</text>
  <text class="no" x="36" y="270">✗ đọc tên venue của event: phải JOIN</text>
  <text class="ok" x="36" y="292">✓ đổi tên venue: sửa đúng 1 dòng</text>
  <text class="s" x="36" y="314">ô xanh = dòng phải sửa khi đổi tên</text>

  <!-- Phi chuẩn hoá -->
  <rect class="grp" x="388" y="16" width="352" height="310" rx="12"/>
  <text class="h" x="404" y="40">Phi chuẩn hoá (denormalize)</text>
  <text class="tn" x="404" y="64">venues</text>
  <rect class="th" x="404" y="70" width="40" height="22"/><text class="hd" x="410" y="85">id</text>
  <rect class="th" x="444" y="70" width="130" height="22"/><text class="hd" x="450" y="85">name</text>
  <rect class="bad" x="404" y="92" width="40" height="24"/><text class="tdt" x="410" y="109">7</text>
  <rect class="bad" x="444" y="92" width="130" height="24"/><text class="tdt" x="450" y="109">Nhà hát Lớn</text>
  <text class="tn" x="404" y="138">events · chép sẵn venue_name</text>
  <rect class="th" x="404" y="144" width="34" height="22"/><text class="hd" x="410" y="159">id</text>
  <rect class="th" x="438" y="144" width="86" height="22"/><text class="hd" x="444" y="159">name</text>
  <rect class="th" x="524" y="144" width="72" height="22"/><text class="hd" x="530" y="159">venue_id</text>
  <rect class="th" x="596" y="144" width="124" height="22"/><text class="hd" x="602" y="159">venue_name</text>
  <rect class="td" x="404" y="166" width="34" height="24"/><text class="tdt" x="410" y="183">1</text>
  <rect class="td" x="438" y="166" width="86" height="24"/><text class="tdt" x="444" y="183">Hòa nhạc</text>
  <rect class="td" x="524" y="166" width="72" height="24"/><text class="tdt" x="530" y="183">7</text>
  <rect class="bad" x="596" y="166" width="124" height="24"/><text class="tdt" x="602" y="183">Nhà hát Lớn</text>
  <rect class="td" x="404" y="190" width="34" height="24"/><text class="tdt" x="410" y="207">2</text>
  <rect class="td" x="438" y="190" width="86" height="24"/><text class="tdt" x="444" y="207">Kịch</text>
  <rect class="td" x="524" y="190" width="72" height="24"/><text class="tdt" x="530" y="207">7</text>
  <rect class="bad" x="596" y="190" width="124" height="24"/><text class="tdt" x="602" y="207">Nhà hát Lớn</text>
  <rect class="td" x="404" y="214" width="34" height="24"/><text class="tdt" x="410" y="231">3</text>
  <rect class="td" x="438" y="214" width="86" height="24"/><text class="tdt" x="444" y="231">Ballet</text>
  <rect class="td" x="524" y="214" width="72" height="24"/><text class="tdt" x="530" y="231">7</text>
  <rect class="bad" x="596" y="214" width="124" height="24"/><text class="tdt" x="602" y="231">Nhà hát Lớn</text>
  <text class="ok" x="404" y="270">✓ đọc event: 1 bảng, không JOIN</text>
  <text class="no" x="404" y="292">✗ đổi tên venue: sửa 1 + N dòng</text>
  <text class="s" x="404" y="314">sót một dòng là hai nơi lệch nhau</text>

  <text class="t" x="20" y="352">Denormalize khi đọc nhiều hơn ghi hàng trăm lần và JOIN là bottleneck (feed, trang sản phẩm).</text>
  <text class="s" x="20" y="374">Mặc định giữ chuẩn hoá: dữ liệu ở một chỗ thì đổi một chỗ, không có bản sao để lệch.</text>
</svg>
