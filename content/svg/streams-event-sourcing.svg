<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Event sourcing: command handler nạp snapshot và event, append event mới vào event store, projection cập nhật read model</title>
  <!-- Nền sáng cố định: ảnh trong <img> không nhận theme của trang (D11) -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a00"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14a37f"/></marker>
    <style>
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 1.2; }
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .ev { fill: #ffffff; stroke: #cbd5e1; }
      .new { fill: #fff3db; stroke: #e08a00; stroke-width: 1.4; }
      .snap { fill: #e4f5ef; stroke: #14a37f; stroke-dasharray: 5 3; }
      .h { font-size: 14px; font-weight: 650; fill: #1f2937; }
      .hc { font-size: 14px; font-weight: 650; fill: #1f2937; text-anchor: middle; }
      .t { font-size: 13px; fill: #1f2937; }
      .sc { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .s { font-size: 11.5px; fill: #64748b; }
      .e { font-size: 12.5px; fill: #1f2937; }
      .n { font-size: 12.5px; fill: #64748b; text-anchor: end; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #1f2937; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="388" rx="14" fill="#ffffff" stroke="#d6dde6"/>

  <!-- Command -->
  <rect class="box" x="20" y="30" width="180" height="46" rx="10" style="stroke:#3b7ff5;stroke-width:1.6"/>
  <text class="hc" x="110" y="50">Command</text>
  <text class="sc" x="110" y="67">rút 30 từ tài khoản 42</text>
  <path d="M110,76 L110,110" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <rect class="box" x="20" y="112" width="180" height="92" rx="10"/>
  <text class="hc" x="110" y="134">Command handler</text>
  <text class="s" x="32" y="156">① nạp snapshot v3 + v4</text>
  <text class="s" x="32" y="174">② kiểm tra số dư 130 ≥ 30</text>
  <text class="s" x="32" y="192">③ append event mới</text>
  <path d="M200,184 C220,184 222,226 240,226" stroke="#e08a00" stroke-width="1.6" fill="none" marker-end="url(#o)"/>
  <path d="M242,142 C224,142 222,150 202,150" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>

  <!-- Event store -->
  <rect class="grp" x="230" y="20" width="300" height="236" rx="12"/>
  <text class="h" x="244" y="42">Event store · stream account-42</text>
  <text class="s" x="244" y="58">append-only, không sửa, không xoá</text>
  <rect class="ev" x="244" y="68" width="272" height="26" rx="5"/><text class="e" x="254" y="86">v1 · AccountOpened</text><text class="n" x="506" y="86">0</text>
  <rect class="ev" x="244" y="98" width="272" height="26" rx="5"/><text class="e" x="254" y="116">v2 · Deposited(100)</text><text class="n" x="506" y="116">100</text>
  <rect class="ev" x="244" y="128" width="272" height="26" rx="5"/><text class="e" x="254" y="146">v3 · Withdrawn(20)</text><text class="n" x="506" y="146">80</text>
  <rect class="snap" x="244" y="158" width="272" height="26" rx="5"/><text class="e" x="254" y="176" fill="#0f7a5f">snapshot @v3 · balance = 80</text>
  <rect class="ev" x="244" y="188" width="272" height="26" rx="5"/><text class="e" x="254" y="206">v4 · Deposited(50)</text><text class="n" x="506" y="206">130</text>
  <rect class="new" x="244" y="218" width="272" height="26" rx="5"/><text class="e" x="254" y="236">v5 · Withdrawn(30) · mới</text><text class="n" x="506" y="236">100</text>

  <!-- Consumers -->
  <g stroke="#14a37f" stroke-width="1.4" fill="none" marker-end="url(#g)">
    <path d="M530,230 C552,230 550,62 568,62"/>
    <path d="M530,236 C556,236 552,246 568,246"/>
  </g>
  <text class="s" x="244" y="274">④ event mới được publish cho các consumer →</text>
  <rect class="box" x="570" y="36" width="170" height="52" rx="10"/>
  <text class="hc" x="655" y="58">Projection</text>
  <text class="sc" x="655" y="76">fold event → bảng đọc</text>
  <path d="M655,88 L655,118" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <rect class="box" x="570" y="120" width="170" height="64" rx="10" style="stroke:#14a37f;stroke-width:1.6"/>
  <text class="hc" x="655" y="142">Read model</text>
  <text class="code" x="655" y="161" text-anchor="middle">balance = 100</text>
  <text class="sc" x="655" y="177">query đọc ở đây</text>
  <rect class="box" x="570" y="220" width="170" height="52" rx="10"/>
  <text class="hc" x="655" y="242">Consumer khác</text>
  <text class="sc" x="655" y="260">thông báo, analytics</text>

  <text class="t" x="20" y="298">Trạng thái = fold các event: 0 + 100 − 20 + 50 − 30 = 100 (cột số bên phải là số dư sau mỗi event).</text>
  <text class="t" x="20" y="320">Sai thì thêm event bù (compensating event), không sửa event cũ → có đủ lịch sử để audit và replay.</text>
  <text class="s" x="20" y="344">Snapshot giúp không phải replay từ v1 mỗi lần; snapshot dựng lại được từ event bất cứ lúc nào.</text>
  <text class="s" x="20" y="364">Read model cập nhật bất đồng bộ → eventual consistency; consumer phải idempotent vì event có thể tới hơn một lần.</text>
</svg>
